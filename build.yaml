changelog: >
  ## 1.0.0.1
  Fixes the plugin's Settings button opening the dashboard instead of the settings
  page, adds links between the two pages, and reports load failures on the page
  instead of leaving it blank or stuck on a spinner.

  ## 1.0.0.0
  Initial release: Sonarr and Radarr calendar, shows, movies, queue, missing and
  history, with multi-instance support and admin-gated search/removal.
