overview: "Sonarr and Radarr monitoring inside Jellyfin"
description: >
  Adds an Arr Dashboard page showing a release calendar, series and movie status,
  the live download queue, missing items and recent history from one or more
  Sonarr and Radarr instances. All API traffic is proxied server-side, so API
  keys never reach the browser.
